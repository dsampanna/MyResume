<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c10;--bg2:#0d1117;--bg3:#111820;--teal:#0EB5A0;--cyan:#06b6d4;--blue:#2563EB;--border:rgba(14,181,160,0.15);--border2:rgba(255,255,255,0.07);--text:#f0f4f8;--muted:#6b7c8f;--muted2:#8a9eb0;--display:'Syne',sans-serif;--body:'DM Sans',sans-serif}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 2.5rem;border-bottom:1px solid var(--border2);background:rgba(8,12,16,0.97);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);gap:1rem}
.nav-logo{font-family:var(--display);font-size:1rem;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-links{display:flex;gap:1.5rem;list-style:none;align-items:center}
.nav-links a{font-size:0.75rem;color:var(--muted);letter-spacing:0.02em;transition:color 0.2s}
.nav-links a:hover{color:var(--text)}
.nav-back{font-size:0.72rem;font-weight:600;letter-spacing:0.04em;border:1px solid var(--teal);color:var(--teal);padding:0.45rem 1.1rem;transition:background 0.2s,color 0.2s;white-space:nowrap}
.nav-back:hover{background:var(--teal);color:var(--bg)}
@media(max-width:900px){.nav{padding:1rem 1.25rem}.nav-links{display:none}}

/* HERO */
.proj-hero{padding:4rem 2.5rem 3rem;border-bottom:1px solid var(--border2);background:var(--bg2);position:relative;overflow:hidden}
.proj-hero::before{content:'';position:absolute;top:-100px;right:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(14,181,160,0.08) 0%,transparent 70%);pointer-events:none}
.proj-cat-badge{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.62rem;font-weight:700;color:var(--teal);letter-spacing:0.14em;text-transform:uppercase;border:1px solid var(--border);padding:0.3rem 0.8rem;margin-bottom:1.25rem;background:rgba(14,181,160,0.06)}
.proj-title{font-family:var(--display);font-size:clamp(2rem,5vw,4rem);font-weight:800;letter-spacing:-0.04em;line-height:1;color:var(--text);margin-bottom:1.25rem}
.proj-meta{display:flex;flex-wrap:wrap;gap:2rem;font-size:0.8rem;color:var(--muted)}
.proj-meta-item{display:flex;align-items:center;gap:0.4rem}
.proj-meta-dot{width:4px;height:4px;border-radius:50%;background:var(--teal)}
@media(max-width:768px){.proj-hero{padding:2.5rem 1.25rem 2rem}}

/* BODY */
.proj-body{max-width:1100px;margin:0 auto;padding:3rem 2.5rem;display:grid;grid-template-columns:1fr 300px;gap:2.5rem;align-items:start}
@media(max-width:900px){.proj-body{grid-template-columns:1fr;padding:2rem 1.25rem}}

/* MEDIA */
.media-wrap{border:1px solid var(--border2);background:var(--bg3);overflow:hidden;position:relative;margin-bottom:1.5rem}
.media-wrap img{width:100%;display:block;max-height:560px;object-fit:contain;background:var(--bg3)}
.media-wrap iframe{width:100%;height:500px;display:block;border:none;background:#000}
.media-badge{position:absolute;top:1rem;right:1rem;font-size:0.6rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:rgba(8,12,16,0.8);color:var(--teal);border:1px solid var(--border);padding:0.25rem 0.65rem}

/* DESCRIPTION */
.proj-desc-block{border:1px solid var(--border2);background:var(--bg2);padding:1.75rem}
.block-label{font-size:0.62rem;font-weight:700;color:var(--teal);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:0.85rem;display:flex;align-items:center;gap:0.5rem}
.block-label::before{content:'';width:16px;height:1px;background:var(--teal)}
.proj-desc-block p{font-size:0.88rem;color:var(--muted);line-height:1.8}

/* SIDEBAR */
.sidebar{display:flex;flex-direction:column;gap:1.25rem}
.info-card{border:1px solid var(--border2);background:var(--bg2);padding:1.5rem}
.info-card-title{font-size:0.62rem;font-weight:700;color:var(--teal);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:1.25rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border2)}
.info-row{display:flex;flex-direction:column;gap:0.2rem;padding:0.65rem 0;border-bottom:1px solid var(--border2)}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-row-lbl{font-size:0.58rem;font-weight:700;color:var(--teal);letter-spacing:0.1em;text-transform:uppercase}
.info-row-val{font-size:0.84rem;color:var(--text)}
.tools-wrap{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.3rem}
.tool-tag{font-size:0.65rem;font-weight:600;color:var(--teal);border:1px solid var(--border);padding:0.2rem 0.6rem;letter-spacing:0.04em}

/* NAV BUTTONS */
.proj-nav{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem}
.proj-nav-btn{display:flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.7rem;border:1px solid var(--border2);font-size:0.72rem;font-weight:600;color:var(--muted);letter-spacing:0.04em;transition:all 0.2s;text-align:center}
.proj-nav-btn:hover{border-color:var(--teal);color:var(--teal)}
.proj-nav-btn.disabled{opacity:0.3;pointer-events:none}

/* CTA CARD */
.cta-card{border:1px solid var(--border);background:rgba(14,181,160,0.04);padding:1.5rem}
.cta-card .info-card-title{color:var(--teal)}
.cta-card p{font-size:0.82rem;color:var(--muted);line-height:1.7;margin-bottom:1rem}
.cta-btn{display:flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.65rem 1rem;font-size:0.7rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--border2);color:var(--text);margin-bottom:0.5rem;transition:all 0.2s}
.cta-btn:last-child{margin-bottom:0}
.cta-btn:hover{border-color:var(--teal);color:var(--teal);background:rgba(14,181,160,0.06)}
.cta-btn-primary{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.cta-btn-primary:hover{background:#0cc9b2;color:var(--bg)}

/* RELATED */
.related-section{max-width:1100px;margin:0 auto;padding:0 2.5rem 4rem}
.related-divider{max-width:1100px;margin:0 auto;padding:0 2.5rem;border:none;border-top:1px solid var(--border2);margin-bottom:2.5rem}
.related-heading{font-family:var(--display);font-size:1.4rem;font-weight:800;letter-spacing:-0.02em;color:var(--text);margin-bottom:1.5rem}
.related-heading span{background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border2)}
.related-card{background:var(--bg3);display:block;position:relative;overflow:hidden;cursor:pointer}
.related-card img{width:100%;height:160px;object-fit:cover;display:block;transition:transform 0.4s,opacity 0.3s;opacity:0.8}
.related-card:hover img{transform:scale(1.06);opacity:1}
.related-card-info{padding:0.85rem}
.related-card-cat{font-size:0.58rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--teal);margin-bottom:0.2rem}
.related-card-title{font-family:var(--display);font-size:0.82rem;font-weight:700;color:var(--text);line-height:1.2}
@media(max-width:768px){.related-section,.related-divider{padding-left:1.25rem;padding-right:1.25rem}.related-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.related-grid{grid-template-columns:1fr}}

/* NOT FOUND */
.not-found{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:3rem}
.not-found h2{font-family:var(--display);font-size:2rem;font-weight:800;margin-bottom:0.75rem}
.not-found p{color:var(--muted);margin-bottom:1.5rem}

/* FOOTER */
footer{padding:1.5rem 2.5rem;border-top:1px solid var(--border2);background:var(--bg);display:flex;justify-content:space-between;align-items:center;font-size:0.73rem;color:var(--muted);flex-wrap:wrap;gap:1rem}
.f-links{display:flex;gap:1.75rem;flex-wrap:wrap}
.f-links a{color:var(--muted);transition:color 0.2s}
.f-links a:hover{color:var(--teal)}

/* FADE IN */
.fade-in{opacity:0;transform:translateY(16px);animation:fadeUp 0.5s ease forwards}
.fade-in:nth-child(2){animation-delay:0.08s}
.fade-in:nth-child(3){animation-delay:0.16s}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

/* CUSTOM CURSOR */
@media(pointer:fine){body{cursor:none}a,button{cursor:none}}
.cursor-dot{position:fixed;top:0;left:0;width:4px;height:4px;background:#fff;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:background 0.15s;will-change:transform}
.cursor-ring{position:fixed;top:0;left:0;width:30px;height:30px;border:1.5px solid rgba(14,181,160,0.6);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width 0.2s,height 0.2s,border-color 0.2s,background 0.2s,opacity 0.2s;will-change:transform}
.cursor-dot.is-hover{background:var(--teal)}
.cursor-ring.is-hover{width:44px;height:44px;border-color:var(--teal);background:rgba(14,181,160,0.08)}
.cursor-dot.is-hidden,.cursor-ring.is-hidden{opacity:0}
</style>

function render() {
  const id = new URLSearchParams(window.location.search).get('id');
  const index = projects.findIndex(p => p.id === id);
  const content = document.getElementById('page-content');

  if (index === -1) {
    content.innerHTML = `
      <div class="not-found fade-in">
        <h2>Project not found</h2>
        <p>This project doesn't exist or may have been removed.</p>
        <a href="portfolio.html" style="font-size:0.78rem;font-weight:600;color:var(--teal);border:1px solid var(--border);padding:0.65rem 1.5rem;display:inline-block;transition:background 0.2s" onmouseover="this.style.background='rgba(14,181,160,0.1)'" onmouseout="this.style.background=''">← Back to Portfolio</a>
      </div>`;
    return;
  }

  const p = projects[index];
  const prev = index > 0 ? projects[index - 1] : null;
  const next = index < projects.length - 1 ? projects[index + 1] : null;
  const related = projects.filter((r, i) => i !== index && r.category === p.category).slice(0, 3);

  document.title = p.title + ' | Sampanna Raj Dhungel';

  const mediaHTML = p.type === 'drive'
    ? `<iframe src="${p.media}" allow="autoplay" allowfullscreen></iframe><div class="media-badge">▶ Video</div>`
    : `<img src="${p.media}" alt="${p.title}"><div class="media-badge">◼ Design</div>`;

  const toolsHTML = p.tools.map(t => `<span class="tool-tag">${t}</span>`).join('');

  const relatedHTML = related.length > 0 ? `
    <hr class="related-divider">
    <div class="related-section fade-in">
      <div class="related-heading">More <span>${p.category}</span> projects</div>
      <div class="related-grid">
        ${related.map(r => `
          <a href="project.html?id=${r.id}" class="related-card">
            <img src="${r.image}" alt="${r.title}" loading="lazy">
            <div class="related-card-info">
              <div class="related-card-cat">${r.category}</div>
              <div class="related-card-title">${r.title}</div>
            </div>
          </a>`).join('')}
      </div>
    </div>` : '';

  const ctaLinksHTML = p.liveLink
    ? `<a href="${p.liveLink}" target="_blank" rel="noopener noreferrer" class="cta-btn cta-btn-primary">↗ View Live Project</a>`
    : '';
  const caseStudyHTML = p.caseStudy
    ? `<a href="${p.caseStudy}" target="_blank" rel="noopener noreferrer" class="cta-btn">→ View Case Study</a>`
    : '';

  content.innerHTML = `
    <div class="proj-hero fade-in">
      <div class="proj-cat-badge">${p.category}</div>
      <h1 class="proj-title">${p.title}</h1>
      <div class="proj-meta">
        <div class="proj-meta-item"><span class="proj-meta-dot"></span>${p.year}</div>
        <div class="proj-meta-item"><span class="proj-meta-dot"></span>${p.tools.join(', ')}</div>
        <div class="proj-meta-item"><span class="proj-meta-dot"></span>${index + 1} of ${projects.length}</div>
      </div>
    </div>
    <div class="proj-body">
      <div class="fade-in">
        <div class="media-wrap">${mediaHTML}</div>
        <div class="proj-desc-block">
          <div class="block-label">About this project</div>
          <p>${p.description}</p>
        </div>
      </div>
      <div class="sidebar fade-in">
        <div class="info-card">
          <div class="info-card-title">Project Details</div>
          <div class="info-row"><div class="info-row-lbl">Category</div><div class="info-row-val">${p.category}</div></div>
          <div class="info-row"><div class="info-row-lbl">Year</div><div class="info-row-val">${p.year}</div></div>
          <div class="info-row"><div class="info-row-lbl">Designer</div><div class="info-row-val">Sampanna Raj Dhungel</div></div>
          <div class="info-row"><div class="info-row-lbl">Tools Used</div><div class="tools-wrap">${toolsHTML}</div></div>
        </div>
        <div class="info-card">
          <div class="info-card-title">Navigate Projects</div>
          <div class="proj-nav">
            <a href="${prev ? 'project.html?id=' + prev.id : '#'}" class="proj-nav-btn ${!prev ? 'disabled' : ''}">← Prev</a>
            <a href="${next ? 'project.html?id=' + next.id : '#'}" class="proj-nav-btn ${!next ? 'disabled' : ''}">Next →</a>
          </div>
        </div>
        ${(ctaLinksHTML || caseStudyHTML) ? `
        <div class="cta-card info-card">
          <div class="info-card-title">Like this work?</div>
          <p>Let's collaborate on your next project.</p>
          ${ctaLinksHTML}${caseStudyHTML}
          <a href="index.html#contact" class="cta-btn">✉ Get in touch</a>
        </div>` : `
        <div class="cta-card info-card">
          <div class="info-card-title">Like this work?</div>
          <p>Let's collaborate on your next project.</p>
          <a href="index.html#contact" class="cta-btn cta-btn-primary">✉ Get in touch</a>
        </div>`}
      </div>
    </div>
    ${relatedHTML}`;
}

render();

(function(){
  if(!window.matchMedia('(pointer:fine)').matches)return;
  var dot=document.createElement('div');dot.className='cursor-dot';
  var ring=document.createElement('div');ring.className='cursor-ring';
  document.body.appendChild(dot);document.body.appendChild(ring);
  var mx=0,my=0,rx=0,ry=0;
  document.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';if(e.target.closest('a,button,[role="button"]')){dot.classList.add('is-hover');ring.classList.add('is-hover');}else{dot.classList.remove('is-hover');ring.classList.remove('is-hover');}});
  (function tick(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(tick);})();
  document.addEventListener('mouseleave',function(){dot.classList.add('is-hidden');ring.classList.add('is-hidden');});
  document.addEventListener('mouseenter',function(){dot.classList.remove('is-hidden');ring.classList.remove('is-hidden');});
})();
</script>
