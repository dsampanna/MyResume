<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 — Page Not Found | Sampanna Raj Dhungel</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c10;--teal:#0EB5A0;--cyan:#06b6d4;--text:#f0f4f8;--muted:#6b7c8f;--border2:rgba(255,255,255,0.07)}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;overflow:hidden;position:relative}
a{text-decoration:none;color:inherit}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4}
.glow{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(14,181,160,0.06) 0%,transparent 70%);pointer-events:none}
.wrap{position:relative;z-index:1;text-align:center;max-width:560px}
.err-num{font-family:'Syne',sans-serif;font-size:clamp(6rem,20vw,12rem);font-weight:800;line-height:1;letter-spacing:-0.05em;background:linear-gradient(135deg,rgba(14,181,160,0.15),rgba(6,182,212,0.08));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;user-select:none;position:relative}
.err-num::after{content:'404';position:absolute;inset:0;font-family:'Syne',sans-serif;font-size:inherit;font-weight:800;letter-spacing:inherit;background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;clip-path:polygon(0 0,0 0,0 100%,0 100%);animation:reveal 1s cubic-bezier(0.77,0,0.18,1) 0.3s forwards}
@keyframes reveal{to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
.err-title{font-family:'Syne',sans-serif;font-size:clamp(1.1rem,3vw,1.5rem);font-weight:700;letter-spacing:-0.02em;color:var(--text);margin:1.25rem 0 0.75rem}
.err-desc{font-size:0.9rem;color:var(--muted);line-height:1.75;margin-bottom:2.5rem;max-width:400px;margin-left:auto;margin-right:auto}
.err-actions{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-bottom:3rem}
.btn-teal{font-family:'Syne',sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:var(--teal);color:#000;padding:0.75rem 2rem;transition:opacity 0.2s,transform 0.15s;display:inline-block}
.btn-teal:hover{opacity:0.85;transform:translateY(-1px)}
.btn-ghost{font-size:0.78rem;font-weight:600;letter-spacing:0.04em;color:var(--muted);border:1px solid var(--border2);padding:0.75rem 1.75rem;transition:border-color 0.2s,color 0.2s;display:inline-block}
.btn-ghost:hover{border-color:rgba(14,181,160,0.4);color:var(--text)}
.quick-links{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center}
.ql-label{width:100%;font-size:0.6rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:0.25rem}
.ql{font-size:0.72rem;color:var(--muted);border:1px solid var(--border2);padding:0.3rem 0.75rem;transition:color 0.2s,border-color 0.2s}
.ql:hover{color:var(--teal);border-color:rgba(14,181,160,0.35)}
.f-nav{position:fixed;top:1.25rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1rem;background:rgba(13,17,23,0.9);border:1px solid var(--border2);padding:0.5rem 1.25rem;backdrop-filter:blur(12px);z-index:10}
.f-nav-logo{font-family:'Syne',sans-serif;font-size:0.85rem;font-weight:700;background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-right:0.5rem}
.f-nav a{font-size:0.68rem;color:var(--muted);transition:color 0.2s}
.f-nav a:hover{color:var(--text)}
@media(max-width:480px){.f-nav{display:none}}
</style>
</head>
<body>

<div class="glow"></div>

<nav class="f-nav">
  <span class="f-nav-logo">S·D</span>
  <a href="index.html">Home</a>
  <a href="portfolio.html">Work</a>
  <a href="blog.html">Blog</a>
  <a href="index.html#contact">Contact</a>
</nav>

<div class="wrap">
  <div class="err-num" aria-hidden="true">404</div>
  <h1 class="err-title">Page not found</h1>
  <p class="err-desc">This page doesn't exist — or was moved. It happens to the best of us.</p>
  <div class="err-actions">
    <a href="index.html" class="btn-teal">← Go home</a>
    <a href="portfolio.html" class="btn-ghost">View work</a>
  </div>
  <div class="quick-links">
    <div class="ql-label">Or jump to</div>
    <a href="portfolio.html" class="ql">Portfolio</a>
    <a href="blog.html" class="ql">Blog</a>
    <a href="services.html" class="ql">Services</a>
    <a href="now.html" class="ql">Now</a>
    <a href="uses.html" class="ql">Uses</a>
    <a href="guestbook.html" class="ql">Guestbook</a>
    <a href="index.html#contact" class="ql">Contact</a>
  </div>
</div>

</body>
</html>
