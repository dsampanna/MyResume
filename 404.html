<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>404 — Page Not Found | Sampanna Raj Dhungel</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c10;--bg2:#0d1117;--teal:#0EB5A0;--cyan:#06b6d4;--border:rgba(14,181,160,0.15);--border2:rgba(255,255,255,0.07);--text:#f0f4f8;--muted:#6b7c8f;--display:'Syne',sans-serif;--body:'DM Sans',sans-serif}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;text-align:center;padding:2rem}

/* STARS */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:var(--teal);animation:twinkle 3s infinite alternate}
@keyframes twinkle{0%{opacity:0.1;transform:scale(1)}100%{opacity:0.6;transform:scale(1.5)}}

.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0}

.error-code{font-family:var(--display);font-size:clamp(7rem,20vw,14rem);font-weight:800;line-height:1;letter-spacing:-0.06em;background:linear-gradient(135deg,var(--teal),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{0%{opacity:0.8}100%{opacity:1}}

.float-icon{font-size:3rem;margin:0.5rem 0 1.5rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

h2{font-family:var(--display);font-size:clamp(1.2rem,3vw,1.8rem);font-weight:800;letter-spacing:-0.02em;color:var(--text);margin-bottom:0.75rem}

p{font-size:0.88rem;color:var(--muted);max-width:400px;line-height:1.75;margin-bottom:2.5rem}

.btn-group{display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;margin-bottom:3rem}
.btn-primary{font-family:var(--body);font-size:0.75rem;font-weight:600;background:var(--teal);color:var(--bg);border:none;padding:0.75rem 1.75rem;letter-spacing:0.04em;text-transform:uppercase;cursor:pointer;transition:background 0.2s,transform 0.15s;display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none}
.btn-primary:hover{background:#0cc9b2;transform:translateY(-1px)}
.btn-ghost{font-family:var(--body);font-size:0.75rem;font-weight:600;background:transparent;color:var(--text);border:1px solid var(--border2);padding:0.75rem 1.75rem;letter-spacing:0.04em;text-transform:uppercase;transition:border-color 0.2s,color 0.2s;display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}

.redirect-bar{width:300px;height:2px;background:var(--border2);position:relative;overflow:hidden}
.redirect-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));width:0%;animation:fill 15s linear forwards}
@keyframes fill{to{width:100%}}
.redirect-txt{font-size:0.68rem;color:var(--muted);margin-top:0.6rem;letter-spacing:0.04em}

.sig{margin-top:2rem;font-size:0.68rem;color:var(--muted2,#8a9eb0)}
.sig span{color:var(--teal)}

/* CUSTOM CURSOR */
@media(pointer:fine){body{cursor:none}a,button{cursor:none}}
.cursor-dot{position:fixed;top:0;left:0;width:4px;height:4px;background:#fff;border-radius:50%;pointer-events:none;z-index:99999;transform:translate(-50%,-50%);transition:background 0.15s;will-change:transform}
.cursor-ring{position:fixed;top:0;left:0;width:30px;height:30px;border:1.5px solid rgba(14,181,160,0.6);border-radius:50%;pointer-events:none;z-index:99998;transform:translate(-50%,-50%);transition:width 0.2s,height 0.2s,border-color 0.2s,background 0.2s,opacity 0.2s;will-change:transform}
.cursor-dot.is-hover{background:var(--teal)}
.cursor-ring.is-hover{width:44px;height:44px;border-color:var(--teal);background:rgba(14,181,160,0.08)}
.cursor-dot.is-hidden,.cursor-ring.is-hidden{opacity:0}

/* LIGHT MODE */
body.light-mode{background:#f5f7fa;color:#1a2030}
body.light-mode .star{background:#0EB5A0;opacity:0.3}
body.light-mode h2{color:#1a2030}
body.light-mode p{color:#5a6a7a}
body.light-mode .btn-primary{color:#f5f7fa}
body.light-mode .btn-ghost{color:#1a2030;border-color:rgba(0,0,0,0.15)}
body.light-mode .btn-ghost:hover{border-color:#0EB5A0;color:#0EB5A0}
body.light-mode .redirect-txt{color:#5a6a7a}
body.light-mode .sig{color:#5a6a7a}
body.light-mode .cursor-ring{border-color:rgba(14,181,160,0.5)}
</style>
</head>
<body>
<script>if(localStorage.getItem('theme')!=='dark')document.body.classList.add('light-mode');</script>

<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="error-code">404</div>
  <div class="float-icon">🧭</div>
  <h2>Page not found</h2>
  <p>The page you're looking for doesn't exist or may have been moved. Let's get you back on track.</p>
  <div class="btn-group">
    <a href="index.html" class="btn-primary">← Back to Home</a>
    <a href="index.html#contact" class="btn-ghost">✉ Contact Me</a>
  </div>
  <div class="redirect-bar"><div class="redirect-fill"></div></div>
  <div class="redirect-txt">Redirecting to home in 15 seconds…</div>
  <div class="sig">Crafted by <span>Sampanna Raj Dhungel</span></div>
</div>

<script>
const s = document.getElementById('stars');
for(let i=0;i<100;i++){
  const d = document.createElement('div');
  d.className = 'star';
  const size = Math.random()*2+1;
  d.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;width:${size}px;height:${size}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  s.appendChild(d);
}
setTimeout(()=>window.location.href='index.html', 15000);
(function(){
  if(!window.matchMedia('(pointer:fine)').matches)return;
  var dot=document.createElement('div');dot.className='cursor-dot';
  var ring=document.createElement('div');ring.className='cursor-ring';
  document.body.appendChild(dot);document.body.appendChild(ring);
  var mx=0,my=0,rx=0,ry=0;
  document.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';if(e.target.closest('a,button,[role="button"]')){dot.classList.add('is-hover');ring.classList.add('is-hover');}else{dot.classList.remove('is-hover');ring.classList.remove('is-hover');}});
  (function tick(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(tick);})();
  document.addEventListener('mouseleave',function(){dot.classList.add('is-hidden');ring.classList.add('is-hidden');});
  document.addEventListener('mouseenter',function(){dot.classList.remove('is-hidden');ring.classList.remove('is-hidden');});
})();
</script>
<script src="assets/js/cursor-trail.js"></script>
<script src="assets/js/scramble.js"></script>
</body>
</html>
