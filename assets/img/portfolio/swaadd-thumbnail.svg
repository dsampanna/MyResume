  <rect x="72" y="328" width="116" height="22" rx="11" fill="rgba(212,135,10,0.2)" stroke="rgba(212,135,10,0.5)" stroke-width="1"/>
  <text x="130" y="343" text-anchor="middle" font-family="'DM Sans','Segoe UI',sans-serif" font-size="9" font-weight="700" fill="#D4870A" letter-spacing="0.08em">HI-FIDELITY DESIGN</text>

  <!-- Stats line -->
  <text x="72" y="380" font-family="'DM Sans','Segoe UI',sans-serif" font-size="12" fill="rgba(253,246,237,0.5)">4 Apps · 8 Screens · Design Handoff · Figma</text>
  <text x="72" y="398" font-family="'DM Sans','Segoe UI',sans-serif" font-size="11" fill="rgba(253,246,237,0.35)">Kathmandu, Nepal · April 2026</text>

  <!-- Color swatches -->
  <circle cx="72" cy="430" r="8" fill="#B5281C" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="90" cy="430" r="8" fill="#D4870A" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="108" cy="430" r="8" fill="#2D8653" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="126" cy="430" r="8" fill="#2271B1" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <circle cx="144" cy="430" r="8" fill="#FDF6ED" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="160" y="435" font-family="'DM Sans','Segoe UI',sans-serif" font-size="10" fill="rgba(253,246,237,0.4)" letter-spacing="0.06em">Design Tokens</text>

