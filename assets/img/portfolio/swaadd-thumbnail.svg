  <text x="548" y="100" font-family="'DM Sans','Segoe UI',sans-serif" font-size="9" fill="rgba(253,246,237,0.7)">Thamel, Kathmandu ▼</text>
  <!-- Search bar -->
  <rect x="548" y="108" width="142" height="20" rx="10" fill="rgba(255,255,255,0.15)"/>
  <text x="560" y="122" font-family="'DM Sans','Segoe UI',sans-serif" font-size="8" fill="rgba(255,255,255,0.6)">Search momos, dal bhat...</text>

  <!-- Promo banner -->
