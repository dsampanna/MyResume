<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B1A12"/>
      <stop offset="100%" stop-color="#B5281C"/>
    </linearGradient>
    <linearGradient id="wavefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="phoneClip">
      <rect x="520" y="52" width="200" height="390" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Mountain wave decorations (right side) -->
  <path d="M580,0 L800,0 L800,500 L500,500 Q600,380 700,260 Q780,180 750,80 Z" fill="rgba(255,255,255,0.04)"/>
  <path d="M650,0 L800,0 L800,500 L620,500 Q700,360 780,220 Z" fill="rgba(255,255,255,0.03)"/>

  <!-- Triangle motifs (left column — like Swaadd branding) -->
  <polygon points="30,60 58,60 44,38" fill="#D4870A" opacity="0.85"/>
  <polygon points="30,100 58,100 44,78" fill="#2D8653" opacity="0.85"/>
  <polygon points="30,140 58,140 44,118" fill="#8B1A12" opacity="0.7"/>
  <polygon points="30,180 58,180 44,158" fill="#C0392B" opacity="0.6"/>
  <polygon points="30,220 58,220 44,198" fill="#2271B1" opacity="0.85"/>

  <!-- App icon circle -->
  <circle cx="110" cy="120" r="38" fill="rgba(253,246,237,0.12)" stroke="rgba(253,246,237,0.2)" stroke-width="1.5"/>
  <circle cx="110" cy="120" r="26" fill="rgba(253,246,237,0.15)"/>
  <text x="110" y="128" text-anchor="middle" font-size="22">🍽️</text>

  <!-- Main title -->
  <text x="68" y="210" font-family="'Syne','Segoe UI',sans-serif" font-size="82" font-weight="800" fill="#FDF6ED" letter-spacing="-2" opacity="0.97">Swaadd</text>

  <!-- Devanagari subtitle -->
  <text x="72" y="255" font-family="'Noto Sans Devanagari','Segoe UI',sans-serif" font-size="26" font-weight="600" fill="#D4870A" letter-spacing="2">स्वाद</text>

  <!-- Tagline -->
  <text x="72" y="292" font-family="'DM Sans','Segoe UI',sans-serif" font-size="14" fill="rgba(253,246,237,0.65)" letter-spacing="0.05em">Taste of Nepal, Delivered</text>

  <!-- Divider -->
  <line x1="72" y1="314" x2="380" y2="314" stroke="rgba(212,135,10,0.35)" stroke-width="1"/>

