  <rect x="520" y="52" width="200" height="390" rx="24" fill="#1A1208" stroke="rgba(253,246,237,0.12)" stroke-width="1.5"/>
  <rect x="534" y="66" width="172" height="362" rx="14" fill="#FDF6ED" clip-path="url(#phoneClip)"/>

  <!-- Phone header — red -->
  <rect x="534" y="66" width="172" height="70" rx="0" fill="#B5281C"/>
  <rect x="534" y="66" width="172" height="70" rx="14" fill="#B5281C"/>
  <rect x="534" y="100" width="172" height="36" fill="#B5281C"/>

  <!-- Header text -->
