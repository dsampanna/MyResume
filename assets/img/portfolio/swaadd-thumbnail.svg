  <text x="556" y="154" font-family="'DM Sans','Segoe UI',sans-serif" font-size="8" font-weight="700" fill="#fff">50% OFF — First Order!</text>
  <text x="556" y="164" font-family="'DM Sans','Segoe UI',sans-serif" font-size="7" fill="rgba(255,255,255,0.8)">Code: SWAADD50</text>

  <!-- Category pills -->
  <rect x="548" y="176" width="38" height="16" rx="8" fill="#B5281C"/>
  <text x="567" y="187" text-anchor="middle" font-family="'DM Sans','Segoe UI',sans-serif" font-size="7" font-weight="600" fill="#fff">Momos</text>
  <rect x="592" y="176" width="38" height="16" rx="8" fill="rgba(181,40,28,0.12)" stroke="#B5281C" stroke-width="0.8"/>
  <text x="611" y="187" text-anchor="middle" font-family="'DM Sans','Segoe UI',sans-serif" font-size="7" fill="#B5281C">Dal Bhat</text>
  <rect x="636" y="176" width="38" height="16" rx="8" fill="rgba(181,40,28,0.12)" stroke="#B5281C" stroke-width="0.8"/>
  <text x="655" y="187" text-anchor="middle" font-family="'DM Sans','Segoe UI',sans-serif" font-size="7" fill="#B5281C">Chatai</text>

  <!-- Restaurant card -->
  <rect x="548" y="200" width="66" height="76" rx="8" fill="#fff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/>
  <rect x="548" y="200" width="66" height="38" rx="8" fill="#B5281C" opacity="0.85"/>
  <rect x="548" y="222" width="66" height="16" fill="#B5281C" opacity="0.85"/>
  <text x="581" y="218" text-anchor="middle" font-size="14">🥟</text>
  <text x="554" y="250" font-family="'DM Sans','Segoe UI',sans-serif" font-size="7" font-weight="700" fill="#1A1208">Momo Magic</text>
  <text x="554" y="260" font-family="'DM Sans','Segoe UI',sans-serif" font-size="6" fill="#7A6A5A">⏱ 15–20 min</text>
  <text x="554" y="270" font-family="'DM Sans','Segoe UI',sans-serif" font-size="6" fill="#D4870A">4.8 ★  ₹50</text>

  <!-- Second card -->
  <rect x="622" y="200" width="66" height="76" rx="8" fill="#fff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.08))"/>
  <rect x="622" y="200" width="66" height="38" rx="8" fill="#2D8653" opacity="0.85"/>
  <rect x="622" y="222" width="66" height="16" fill="#2D8653" opacity="0.85"/>
  <text x="655" y="218" text-anchor="middle" font-size="14">🍛</text>
  <text x="628" y="250" font-family="'DM Sans','Segoe UI',sans-serif" font-size="7" font-weight="700" fill="#1A1208">Thakali Kit.</text>
  <text x="628" y="260" font-family="'DM Sans','Segoe UI',sans-serif" font-size="6" fill="#7A6A5A">⏱ 20–30 min</text>
  <text x="628" y="270" font-family="'DM Sans','Segoe UI',sans-serif" font-size="6" fill="#D4870A">4.6 ★  ₹40</text>

  <!-- Bottom nav -->
  <rect x="534" y="388" width="172" height="40" rx="0" fill="#1A1208"/>
  <rect x="534" y="388" width="172" height="40" rx="0" fill="#fff" opacity="0.96"/>
  <text x="562" y="413" text-anchor="middle" font-size="12">🏠</text>
  <text x="602" y="413" text-anchor="middle" font-size="12">🔍</text>
  <text x="642" y="413" text-anchor="middle" font-size="12">📋</text>
  <text x="682" y="413" text-anchor="middle" font-size="12">👤</text>
  <!-- Active indicator -->
  <rect x="553" y="425" width="18" height="2" rx="1" fill="#B5281C"/>

  <!-- Home notch -->
  <rect x="590" y="442" width="60" height="4" rx="2" fill="rgba(0,0,0,0.15)"/>

  <!-- UI/UX badge -->
  <rect x="72" y="456" width="122" height="22" rx="3" fill="none" stroke="rgba(253,246,237,0.25)" stroke-width="1"/>
  <text x="133" y="471" text-anchor="middle" font-family="'DM Sans','Segoe UI',sans-serif" font-size="9" font-weight="700" fill="rgba(253,246,237,0.6)" letter-spacing="0.1em">UI/UX · HI-FIDELITY</text>
</svg>
